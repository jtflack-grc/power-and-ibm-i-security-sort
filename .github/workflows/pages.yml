# Build static SPA with a scheduled live-triage.json snapshot (no open API).
name: Pages sample deploy

on:
  workflow_dispatch:
  schedule:
    # Daily refresh of public intel snapshot for Pages visitors.
    - cron: "15 12 * * *"
  push:
    branches: [main, agent/ibmi-ironterm-preview]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Refresh live triage snapshot
        id: snapshot
        continue-on-error: true
        env:
          PYTHONPATH: backend
          # Optional — fuller NVD recipe when set as a repo secret. Never baked into SPA.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python -m app.scripts.refresh_live_snapshot --force-refresh
          test -f frontend/public/live-triage.json
          echo "Live snapshot ready for Pages bundle."

      - name: Snapshot fallback notice
        if: steps.snapshot.outcome != 'success'
        run: |
          echo "::warning::Live snapshot failed — Pages will ship with sample fixture only."
          rm -f frontend/public/live-triage.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static SPA
        working-directory: frontend
        # Relative base so the demo works under https://user.github.io/repo/
        run: |
          npm ci || npm install
          npx vite build --base=./
          # Ensure Pages does not run Jekyll against the SPA
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
