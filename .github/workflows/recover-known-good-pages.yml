name: One-time Pages recovery

on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-known-good-pages.yml]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download known-good Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: previous
          repository: jtflack-grc/power-and-ibm-i-security-sort
          run-id: 31325462943
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore artifact contents
        run: |
          mkdir recovered
          tar -xf previous/artifact.tar -C recovered
          test -f recovered/live-triage.json

      - name: Upload recovered Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: recovered

      - id: deployment
        uses: actions/deploy-pages@v4
